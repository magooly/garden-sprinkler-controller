plugins {
    id 'com.android.application'
}

android {
    namespace 'au.com.gardensprinklers.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.gardensprinklers.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'sprinkler_url', 'https://ubuntu120gb.tail6afeba.ts.net/'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
